[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stepback"
version = "0.1.0"
description = "StepBack: step-level error-localized resampling for efficient test-time reasoning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "vllm==0.9.2",
    "torch==2.7.0",
    "transformers==4.53.2",
]

[project.optional-dependencies]
oracle = ["openai>=1.66"]

[project.scripts]
stepback = "stepback.cli:main"

[tool.setuptools.packages.find]
include = ["stepback*"]
